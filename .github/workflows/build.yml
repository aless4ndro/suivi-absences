name: Compiler le .exe

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: "Numéro de version à publier (ex. 0.9.2). Laisser vide pour une simple compilation."
        required: false
        type: string

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Appliquer le numéro de version demandé
        if: ${{ inputs.version != '' }}
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version
      - run: npm ci
      - run: npm test
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: SuiviAbsences
          path: release/SuiviAbsences-Setup.exe
          if-no-files-found: error
      # Publication d'une Release GitHub (c'est elle que l'application détecte pour proposer la mise à jour).
      # - en un clic : Actions > Compiler le .exe > Run workflow, en indiquant le numéro de version ;
      # - ou en poussant un tag vX.Y.Z.
      - name: Déterminer la version publiée
        id: pub
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$VERSION" ]; then echo "tag=v$VERSION" >> "$GITHUB_OUTPUT";
          elif [[ "$REF" == refs/tags/v* ]]; then echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT";
          else echo "tag=" >> "$GITHUB_OUTPUT"; fi
      - if: steps.pub.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pub.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: release/SuiviAbsences-Setup.exe
          generate_release_notes: true
